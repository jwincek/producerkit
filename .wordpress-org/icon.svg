<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ProducerKit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E8E41"/>
      <stop offset="100%" stop-color="#1F5D2A"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA83F"/>
      <stop offset="100%" stop-color="#E05F07"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Carrot only. An earlier draft put a stand awning above it, but the
       awning and the carrot greens occupy the same band of the canvas: they
       collided at 128px and merged into one white blob at the 40px
       WordPress.org search row. One mark, read clearly, beats two.
       The carrot itself is the plugin's existing branding — dashicons-carrot
       is already the admin menu icon and the block category icon. -->
  <g transform="translate(128,146) rotate(-10)">
    <!-- Root: rounded shoulder tapering to a point. -->
    <path d="M -34 -34
             a 34 34 0 0 1 68 0
             L 7 82
             a 8 8 0 0 1 -14 0
             Z"
          fill="url(#root)"/>

    <!-- Two ridge marks. More than that turns to noise below 64px. -->
    <g stroke="#B94D06" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="-15" y1="4"  x2="15" y2="-6"/>
      <line x1="-10" y1="40" x2="10" y2="32"/>
    </g>

    <!-- Greens: three blades, the centre one upright. Sized to stay separate
         from each other at small scale rather than fusing into a green cap. -->
    <g fill="#A5DC52">
      <path d="M -7 -36 C -44 -50 -58 -80 -54 -100 C -30 -92 -12 -66 -7 -42 Z"/>
      <path d="M  7 -36 C  44 -50  58 -80  54 -100 C  30 -92  12 -66  7 -42 Z"/>
      <path d="M -11 -38 C -14 -74 -6 -104 0 -116 C 6 -104 14 -74 11 -38 Z"/>
    </g>
  </g>
</svg>
